[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-plugin-info"
version = "0.1.0"
description = "Fetch WordPress plugin and theme metadata and SHA-256 hashes"
authors = [
    { name = "Lucas", email = "lucas@smartmousetravel.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.3",
]

[project.scripts]
wp_plugin_info = "wp_plugin_info:main"

[dependency-groups]
dev = [
    "black",
    "isort",
    "mypy",
]
typing = [
    "types-requests>=2.32.0.20250306"
]

[tool.black]
line-length = 98
quiet = true

[tool.mypy]
strict = true
